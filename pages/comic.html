<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Comic Page Generator</title>

<style>
@page {
  size: letter;
  margin: 0.5in;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
}

.controls {
  display: flex;
  gap: 1rem;
  padding: 0.5rem;
}

button {
  padding: 0.4rem 0.8rem;
  cursor: pointer;
}

svg {
  width: 100%;
  height: auto;
  display: block;
}

@media print {
  .controls { display: none; }
}
</style>
</head>
<body>

<div class="controls">
  <button onclick="generate()">Regenerate</button>
  <button onclick="window.print()">Print</button>
</div>

<div id="page"></div>

<script>
const INCH = 96;
const PAGE_W = 8.5 * INCH;
const PAGE_H = 11 * INCH;

const MARGIN = 0.5 * INCH;
const GUTTER = 12;
const STROKE = 4;

const ROWS = 3;

// Panel sanity limits
const MIN_PANEL_WIDTH = 0.8 * INCH;

// ------------------------

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function weightedSplits(n, variance = 0.4) {
  const weights = Array.from({ length: n }, () => rand(1 - variance, 1 + variance));
  const sum = weights.reduce((a, b) => a + b, 0);
  return weights.map(w => w / sum);
}

// Prevent ugly super-thin panels
function fixThinPanels(splits, totalWidth, panelCount) {
  const usable = totalWidth - (panelCount - 1) * GUTTER;

  for (let i = 0; i < splits.length; i++) {
    const w = splits[i] * usable;
    if (w < MIN_PANEL_WIDTH) {
      splits[i] = MIN_PANEL_WIDTH / usable;
    }
  }

  // renormalize
  const sum = splits.reduce((a, b) => a + b, 0);
  return splits.map(s => s / sum);
}

// Occasionally produce cinematic rows
function pickPanelCount() {
  const r = Math.random();
  if (r < 0.2) return 1; // full-width panel
  if (r < 0.6) return 2;
  return 3;
}

function generate() {
  const contentW = PAGE_W - 2 * MARGIN;
  const contentH = PAGE_H - 2 * MARGIN;

  const totalGutterH = (ROWS - 1) * GUTTER;
  const usableH = contentH - totalGutterH;

  // Row height distribution
  const rowSplits = weightedSplits(ROWS, 0.35);

  let svg = `
  <svg xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 ${PAGE_W} ${PAGE_H}">
    <rect width="${PAGE_W}" height="${PAGE_H}" fill="white"/>
    <g fill="white" stroke="black" stroke-width="${STROKE}">
  `;

  let y = MARGIN;

  for (let r = 0; r < ROWS; r++) {
    const rowH = rowSplits[r] * usableH;

    const panelCount = pickPanelCount();

    let splits = weightedSplits(panelCount, 0.5);
    splits = fixThinPanels(splits, contentW, panelCount);

    let x = MARGIN;

    for (let i = 0; i < panelCount; i++) {
      const w = splits[i] * (contentW - (panelCount - 1) * GUTTER);

      svg += `<rect x="${x}" y="${y}" width="${w}" height="${rowH}" />`;
      x += w + GUTTER;
    }

    y += rowH + GUTTER;
  }

  svg += `</g></svg>`;
  document.getElementById("page").innerHTML = svg;
}

generate();
</script>

</body>
</html>
